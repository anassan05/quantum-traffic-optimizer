[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-traffic-optimizer"
version = "0.1.0"
description = "Hybrid quantum-classical urban traffic optimization platform."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
	"networkx>=3.0",
	"qiskit>=2.5,<3",
	"qiskit-aer>=0.17,<1",
	"plotly>=5.0",
	"streamlit>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"